<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6558ed"><title>TaskFlow Calendar</title><link rel="manifest" href="manifest.json"><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#24243b;background:#f5f4ff}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:18px 14px 80px}header,.line,.nav,.task,.stats,.weekstats{display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{margin:0;color:#5849dc}small,.muted{color:#77758d}.panel{background:white;border-radius:22px;padding:18px;margin-top:15px;box-shadow:0 8px 26px #4338ca0b}.stats{display:grid;grid-template-columns:repeat(3,1fr)}.stat{text-align:center;background:#f3f1ff;border-radius:16px;padding:14px 5px}.stat strong{display:block;font-size:28px;color:#5849dc}.stat:nth-child(2){background:#fff4e6}.stat:nth-child(2) strong{color:#d98220}.stat:nth-child(3){background:#e9faf0}.stat:nth-child(3) strong{color:#19975c}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#6558ed;color:white;font-weight:650}button.secondary{background:#f0eeff;color:#5549cb}button.ghost{background:transparent;color:#6558ed}button.danger{background:#fff0f0;color:#b52d43}button:disabled{opacity:.5}input,select,textarea{border:1px solid #dedbea;border-radius:12px;padding:11px;width:100%;background:white;color:#25243a}.nav h2{font-size:18px;margin:0}.nav button{padding:8px 12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:16px}.dow{text-align:center;color:#77758d;font-size:12px;padding:7px}.day{min-height:63px;padding:6px 2px;background:#faf9ff;color:#333;border:2px solid transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500}.day.other{opacity:.35}.day.selected{background:#e9e6ff;border-color:#6558ed}.day.today .num{background:#6558ed;color:white;border-radius:100px;padding:3px 7px}.day .count{font-size:11px;background:#ded9ff;color:#5549cb;border-radius:20px;padding:1px 6px}.day .count.zero{visibility:hidden}.weekstats{flex-wrap:wrap;background:#f3f1ff;border-radius:14px;padding:12px;margin-top:12px;font-size:13px}.task{padding:12px 0;border-bottom:1px solid #f0eef6;touch-action:pan-y}.task:last-child{border:0}.task label{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.task input[type=checkbox]{width:21px;height:21px;accent-color:#6558ed;flex-shrink:0}.task .info{min-width:0}.task .name{font-weight:650;overflow-wrap:anywhere}.task.done .name{text-decoration:line-through;color:#999}.task .meta{font-size:12px;color:#888;margin-top:4px}.task .actions{display:flex;gap:5px}.task .actions button{padding:7px 9px;font-size:12px}.chip{display:inline-block;border-radius:12px;background:#fff0d6;color:#b96b13;padding:3px 7px;font-size:11px}.empty{color:#85829b;text-align:center;padding:22px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid .wide{grid-column:1/-1}.formgrid label{font-size:12px;color:#77758d;display:block;margin-bottom:5px}.formgrid button{width:100%}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{font-size:12px;padding:8px 10px}.filters button.active{background:#6558ed;color:white}.pill{background:#f0eeff;border-radius:12px;padding:7px 10px;font-size:12px;color:#5849dc}dialog{border:0;border-radius:22px;max-width:440px;width:calc(100% - 30px);box-shadow:0 20px 80px #2225}dialog::backdrop{background:#1c184c88}dialog h3{margin-top:0}.foot{margin-top:20px;font-size:12px;color:#8a879b;text-align:center}@media(min-width:720px){.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}.layout .panel{margin-top:15px}}@media(max-width:420px){.app{padding:12px 9px 60px}.panel{padding:13px}.day{min-height:55px}.task .actions{flex-direction:column}}
</style></head><body><main class="app"><header><div><h1>✨ TaskFlow</h1><small>Your colourful task calendar</small></div><button id="todayBtn" class="secondary">Today</button></header><section class="panel stats"><div class="stat"><strong id="total">0</strong><small>Total</small></div><div class="stat"><strong id="remaining">0</strong><small>Remaining</small></div><div class="stat"><strong id="completed">0</strong><small>Completed</small></div></section><div class="layout"><div><section class="panel"><div class="nav"><button class="secondary" id="prevMonth">‹</button><h2 id="monthTitle"></h2><button class="secondary" id="nextMonth">›</button></div><div id="calendar" class="calendar"></div></section><section class="panel"><div class="nav"><button class="secondary" id="prevWeek">‹</button><h2 id="weekTitle"></h2><button class="secondary" id="nextWeek">›</button></div><div id="weekStats" class="weekstats"></div><div class="line" style="margin-top:16px"><b>📥 Unallocated this week</b><span class="pill" id="unallocatedCount">0</span></div><div id="unallocatedList"></div></section></div><div><section class="panel" id="dailyPanel"><div class="nav"><button class="secondary" id="prevDay">‹</button><h2 id="dayTitle"></h2><button class="secondary" id="nextDay">›</button></div><div class="filters" id="filters"><button data-filter="all" class="active">All</button><button data-filter="open" class="secondary">Remaining</button><button data-filter="done" class="secondary">Completed</button></div><div id="dayList"></div></section><section class="panel"><h2 style="text-align:center">➕ Add task</h2><form id="taskForm" class="formgrid"><div class="wide"><label for="taskName">Task</label><input id="taskName" placeholder="What needs doing?" required maxlength="200"></div><div><label for="taskDate">Date</label><input id="taskDate" type="date"></div><div><label for="taskTime">Time (optional)</label><input id="taskTime" type="time"></div><div><label for="taskPriority">Priority</label><select id="taskPriority"><option>Medium</option><option>High</option><option>Low</option></select></div><div><label for="taskCategory">Category</label><select id="taskCategory"><option>Personal</option><option>Work</option><option>Family</option><option>Other</option></select></div><div class="wide"><label><input id="isUnallocated" type="checkbox" style="width:auto"> Unallocated task for selected week</label></div><div class="wide"><button type="submit">Save task</button></div></form></section><section class="panel"><div class="line"><b>🔎 Find tasks</b><button id="exportBtn" class="secondary">Export backup</button></div><input id="search" placeholder="Search all tasks..." style="margin-top:10px"><div id="searchResults"></div></section></div></div><div class="foot" id="syncStatus">Saved on this device</div></main><dialog id="editDialog"><h3>Edit task</h3><form id="editForm" class="formgrid"><input id="editId" type="hidden"><div class="wide"><label>Task</label><input id="editName" required maxlength="200"></div><div><label>Date</label><input id="editDate" type="date"></div><div><label>Time</label><input id="editTime" type="time"></div><div><label>Priority</label><select id="editPriority"><option>Medium</option><option>High</option><option>Low</option></select></div><div><label>Category</label><select id="editCategory"><option>Personal</option><option>Work</option><option>Family</option><option>Other</option></select></div><div class="wide"><label><input type="checkbox" id="editUnallocated" style="width:auto"> Unallocated for this week</label></div><div class="wide" style="display:flex;gap:8px"><button type="button" class="secondary" id="closeEdit">Cancel</button><button type="submit">Save changes</button></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="app.js"></script></body></html>
